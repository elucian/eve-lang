# Configuration of the project project (spec/library/database.md#configuration-evecfg)
** The core database: logs and metadata, read as $EVE_CORE_DB.
core_db = "db/local.db"

** The minimal fallback log: fatal crashes, unhandled panics and startup failures only.
** Plain text, append-only; at the size limit the file is renamed to <file>.1 and a new one starts.
fallback_log = "log/eve.log"
fallback_log_max = "5MB"

** The test database (evedb) lives in the test folder.
** database "check" = "evedb://test/check.duckdb"

** The machine (spec/library/machine.md): its name and the ports of its two doors.
** The IPC door (eve -lsn) is a Unix socket named from domain and ipc_port; the HTTP door (eve --serve)
** answers on http_host:http_port with the files of the web folder and with JSON-RPC in POST /rpc.
domain = "localhost"
ipc_port = 4042
http_port = 8042
http_host = "localhost"
web = "web"

** The machine that a bare -rem addresses (eve -rem -x src/hello.eve): here the same computer.
remote = "127.0.0.1:8042"
