<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Consolas, 'Courier New', monospace" font-size="13">
<title>evetx: project dialog, connect dialog, upload and the data flow</title>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8fa3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter></defs>
<rect width="1240" height="790" fill="#0f141a"/>
<text x="20" y="26" fill="#e6edf3" font-size="18" font-weight="bold" xml:space="preserve">evetx: project dialog, connect dialog, upload and the data flow</text>
<text x="20" y="44" fill="#8fa3b8" xml:space="preserve">The dialogs around the IDE screen: choose a project from the user cache, connect with a hidden password, upload the server side.</text>
<g filter="url(#sh)">
<rect x="20" y="70" width="600" height="330" fill="#1b2330" stroke="#5aa9e6" stroke-width="2" rx="4"/>
<rect x="21" y="71" width="598" height="26" fill="#2b4a6b"/>
<text x="32" y="89" fill="#ffffff" font-weight="bold" xml:space="preserve">Select project  (Ctrl+O)</text>
<text x="608" y="89" fill="#cfe3f5" text-anchor="end" xml:space="preserve">Esc closes</text>
</g>
<text x="34" y="110" fill="#a9b7c6" xml:space="preserve">Filter:</text>
<rect x="90" y="96" width="510" height="20" fill="#0c1015" stroke="#3b4756" stroke-width="1"/>
<text x="98" y="111" fill="#e6edf3" xml:space="preserve">sal</text>
<text x="122" y="111" fill="#5aa9e6" xml:space="preserve">█</text>
<text x="34" y="140" fill="#8fa3b8" xml:space="preserve">name            machine   last opened         path</text>
<line x1="34" y1="146" x2="606" y2="146" stroke="#3b4756"/>
<rect x="30" y="152" width="580" height="20" fill="#2b4a6b"/>
<text x="34" y="166" fill="#ffffff" xml:space="preserve">sales_etl       prod      today 09:12         C:\work\sales_etl</text>
<text x="34" y="188" fill="#a9b7c6" xml:space="preserve">sales_report    test      yesterday           C:\work\sales_report</text>
<text x="34" y="210" fill="#a9b7c6" xml:space="preserve">salesforce_in   local     3 days ago          D:\eve\salesforce_in</text>
<text x="34" y="232" fill="#6c7a89" xml:space="preserve">(3 of 14 projects)</text>
<text x="34" y="330" fill="#6c7a89" font-size="11" xml:space="preserve">Source: the user cache …/eve/meta/eve.db (SQLite, table project). Deleting it loses nothing.</text>
<rect x="34" y="350" width="90" height="26" fill="#2f6f4f" stroke="#58c08a" stroke-width="1" rx="3"/>
<text x="79.0" y="368.0" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">Open</text>
<rect x="136" y="350" width="90" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="181.0" y="368.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">New…</text>
<rect x="238" y="350" width="100" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="288.0" y="368.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Browse…</text>
<rect x="350" y="350" width="100" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="400.0" y="368.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Forget</text>
<g filter="url(#sh)">
<rect x="660" y="70" width="540" height="200" fill="#1b2330" stroke="#5aa9e6" stroke-width="2" rx="4"/>
<rect x="661" y="71" width="538" height="26" fill="#2b4a6b"/>
<text x="672" y="89" fill="#ffffff" font-weight="bold" xml:space="preserve">Connect to prod  (F2, or Ctrl+K)</text>
<text x="1188" y="89" fill="#cfe3f5" text-anchor="end" xml:space="preserve">Esc closes</text>
</g>
<text x="676" y="120" fill="#a9b7c6" xml:space="preserve">Username</text>
<rect x="770" y="106" width="410" height="20" fill="#0c1015" stroke="#3b4756" stroke-width="1"/>
<text x="778" y="121" fill="#e6edf3" xml:space="preserve">ana</text>
<text x="676" y="156" fill="#a9b7c6" xml:space="preserve">Password</text>
<rect x="770" y="142" width="410" height="20" fill="#0c1015" stroke="#5aa9e6" stroke-width="1"/>
<text x="778" y="157" fill="#e6edf3" xml:space="preserve">********</text>
<text x="850" y="157" fill="#5aa9e6" xml:space="preserve">█</text>
<text x="676" y="188" fill="#6c7a89" font-size="11" xml:space="preserve">The user name is in clear, the password is shown as stars and is never kept.</text>
<text x="676" y="202" fill="#6c7a89" font-size="11" xml:space="preserve">Not asked when eve.env has an entry for prod (one entry per machine, JSON).</text>
<rect x="676" y="220" width="100" height="26" fill="#2f6f4f" stroke="#58c08a" stroke-width="1" rx="3"/>
<text x="726.0" y="238.0" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">Connect</text>
<rect x="788" y="220" width="100" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="838.0" y="238.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Cancel</text>
<g filter="url(#sh)">
<rect x="660" y="296" width="540" height="160" fill="#1b2330" stroke="#5aa9e6" stroke-width="2" rx="4"/>
<rect x="661" y="297" width="538" height="26" fill="#2b4a6b"/>
<text x="672" y="315" fill="#ffffff" font-weight="bold" xml:space="preserve">Upload to prod  (Ctrl+U)</text>
<text x="1188" y="315" fill="#cfe3f5" text-anchor="end" xml:space="preserve">Esc closes</text>
</g>
<text x="676" y="338" fill="#8fa3b8" xml:space="preserve">what would be sent (changed files only)</text>
<line x1="676" y1="344" x2="1184" y2="344" stroke="#3b4756"/>
<text x="676" y="362" fill="#a9b7c6" xml:space="preserve">proc/load_orders.eve        changed</text>
<text x="1100" y="362" fill="#5aa9e6" xml:space="preserve">server</text>
<text x="676" y="380" fill="#a9b7c6" xml:space="preserve">sql/schema.sql              new</text>
<text x="1100" y="380" fill="#5aa9e6" xml:space="preserve">server</text>
<text x="676" y="398" fill="#a9b7c6" xml:space="preserve">lib/text.eve                changed</text>
<text x="1100" y="398" fill="#e0b341" xml:space="preserve">imported</text>
<text x="676" y="414" fill="#6c7a89" font-size="11" xml:space="preserve">5 in sync, 1 local only. Sent: web/ proc/ sql/ server/ + what they import.</text>
<rect x="676" y="422" width="100" height="26" fill="#2f6f4f" stroke="#58c08a" stroke-width="1" rx="3"/>
<text x="726.0" y="440.0" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">Send</text>
<rect x="788" y="422" width="130" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="853.0" y="440.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Dry run</text>
<rect x="930" y="422" width="100" height="26" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="3"/>
<text x="980.0" y="440.0" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Cancel</text>
<text x="20" y="440" fill="#e6edf3" font-size="15" font-weight="bold" xml:space="preserve">Data flow</text>
<rect x="240" y="462" width="190" height="56" fill="#243447" stroke="#5aa9e6" stroke-width="2" rx="5"/>
<text x="335" y="484" fill="#ffffff" font-weight="bold" text-anchor="middle" xml:space="preserve">evetx</text>
<text x="335" y="504" fill="#a9b7c6" font-size="11" text-anchor="middle" xml:space="preserve">model · update · view</text>
<rect x="20" y="462" width="150" height="56" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="5"/>
<text x="95" y="484" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">libvaxis</text>
<text x="95" y="504" fill="#6c7a89" font-size="11" text-anchor="middle" xml:space="preserve">terminal, keys, mouse</text>
<line x1="240" y1="490" x2="171" y2="490" stroke="#3b4756" marker-end="url(#arr)"/>
<rect x="60" y="620" width="120" height="56" fill="#1d2733" stroke="#58c08a" stroke-width="1" rx="5"/>
<text x="120" y="642" fill="#e6edf3" text-anchor="middle" xml:space="preserve">local</text>
<text x="120" y="662" fill="#6c7a89" font-size="11" text-anchor="middle" xml:space="preserve">vm.*  db.*</text>
<line x1="295" y1="518" x2="120" y2="620" stroke="#3b4756" marker-end="url(#arr)"/>
<rect x="210" y="620" width="120" height="56" fill="#1d2733" stroke="#58c08a" stroke-width="1" rx="5"/>
<text x="270" y="642" fill="#e6edf3" text-anchor="middle" xml:space="preserve">prod</text>
<text x="270" y="662" fill="#6c7a89" font-size="11" text-anchor="middle" xml:space="preserve">vm.*  db.*</text>
<line x1="335" y1="518" x2="270" y2="620" stroke="#3b4756" marker-end="url(#arr)"/>
<rect x="360" y="620" width="120" height="56" fill="#1d2733" stroke="#d9534f" stroke-width="1" rx="5"/>
<text x="420" y="642" fill="#e6edf3" text-anchor="middle" xml:space="preserve">test</text>
<text x="420" y="662" fill="#6c7a89" font-size="11" text-anchor="middle" xml:space="preserve">vm.*  db.*</text>
<line x1="375" y1="518" x2="420" y2="620" stroke="#3b4756" marker-end="url(#arr)"/>
<text x="20" y="706" fill="#6c7a89" font-size="11" xml:space="preserve">JSON-RPC 2.0 (evecm/wire): IPC locally, plain HTTP on loopback or</text>
<text x="20" y="720" fill="#6c7a89" font-size="11" xml:space="preserve">behind a reverse proxy remotely. One client task per machine.</text>
<rect x="560" y="462" width="300" height="120" fill="#1d2733" stroke="#e0b341" stroke-width="2" rx="5"/>
<text x="574" y="484" fill="#ffffff" font-weight="bold" xml:space="preserve">user cache (SQLite)</text>
<text x="574" y="504" fill="#a9b7c6" font-size="12" xml:space="preserve">…/eve/meta/eve.db</text>
<text x="574" y="522" fill="#a9b7c6" font-size="12" xml:space="preserve">project · machine · history</text>
<text x="574" y="538" fill="#a9b7c6" font-size="12" xml:space="preserve">upload manifest (file hashes)</text>
<text x="574" y="568" fill="#d98c8c" font-size="12" xml:space="preserve">no passwords, no tokens</text>
<rect x="440" y="536" width="100" height="46" fill="#1d2733" stroke="#3b4756" stroke-width="1" rx="5"/>
<text x="490" y="556" fill="#a9b7c6" text-anchor="middle" xml:space="preserve">Meta</text>
<text x="490" y="572" fill="#6c7a89" font-size="11" text-anchor="middle" xml:space="preserve">interface</text>
<line x1="430" y1="500" x2="490" y2="536" stroke="#3b4756" marker-end="url(#arr)"/>
<line x1="540" y1="559" x2="560" y2="559" stroke="#3b4756" marker-end="url(#arr)"/>
<text x="440" y="600" fill="#6c7a89" font-size="11" xml:space="preserve">in evecm; SQLite in evedb;</text>
<text x="440" y="614" fill="#6c7a89" font-size="11" xml:space="preserve">cmd connects them</text>
<rect x="900" y="462" width="300" height="170" fill="#161c24" stroke="#3b4756" stroke-width="1" rx="5"/>
<text x="914" y="484" fill="#e6edf3" font-weight="bold" xml:space="preserve">Keys</text>
<text x="914" y="506" fill="#a9b7c6" font-size="12" xml:space="preserve">Ctrl+Enter menu · Ctrl+/ help · Ctrl+, settings</text>
<text x="914" y="524" fill="#a9b7c6" font-size="12" xml:space="preserve">F1 local · F2 remote 1 · F3 remote 2</text>
<text x="914" y="542" fill="#a9b7c6" font-size="12" xml:space="preserve">Ctrl+←/→ next machine</text>
<text x="914" y="560" fill="#a9b7c6" font-size="12" xml:space="preserve">Ctrl+↑/↓ command history</text>
<text x="914" y="578" fill="#a9b7c6" font-size="12" xml:space="preserve">F5 run · F8 continue · F9 breakpoint</text>
<text x="914" y="596" fill="#a9b7c6" font-size="12" xml:space="preserve">F11 step into · Shift+F11 step out</text>
<text x="914" y="614" fill="#a9b7c6" font-size="12" xml:space="preserve">Shift+F5 stop · Ctrl+O project · Ctrl+U upload</text>
</svg>
