name = "Eve"
grammar = "eve"
path_suffixes = ["eve"]
line_comments = ["** "]
autoclose_before = ";:.,=)]}"
word_characters = ["$", "@"]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment", "comment_expr", "comment_block"] },
]
