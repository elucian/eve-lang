# Checks on every push: the build, the unit tests, the conformance tests (tree walker), the bytecode tests, the tags and the map.
# Windows is the reference platform and must pass. Ubuntu is allowed to fail until a Linux build has been seen to
# pass once (review R2-PR-D02); remove `continue-on-error` then.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: cache of the fetched packages
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
      - name: unit tests
        run: zig build test --summary all
      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe -p temp/rel
      - name: conformance tests on both engines and bytecode tests
        shell: bash
        run: |
          exe=temp/rel/bin/eve
          if [ "$RUNNER_OS" = "Windows" ]; then exe=temp/rel/bin/eve.exe; fi
          python script/runtest.py all --both --eve "$exe"
          python script/bctest.py --eve "$exe"
      - name: tags, features and links
        run: |
          python script/tagcheck.py
          python generator/evegen.py check
          python script/relnotes.py --check
          python script/mdlinks.py check manual
