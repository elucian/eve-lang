# evedb as a PostgreSQL server on the port of PostgreSQL (comp/evedb/README.md section 9)
# start: eve -s -db --serve evedb.cfg      (or in a window: eve db serve evedb.cfg, or evedb serve --config evedb.cfg)
port = 5432
control_port = 8044
host = "127.0.0.1"
user = "eve"
password = "demo"
auth = "md5"
database "shop" = "data/shop.duckdb"
token = "demo-stop"       # lets `evedb stop --connect 127.0.0.1:8044 --token demo-stop` end the server
